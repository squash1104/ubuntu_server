<!DOCTYPE html>
<html>
<head>
    <title>Teste WebSocket Simples</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .messages { height: 200px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; margin: 10px 0; }
        input, button { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Teste WebSocket Simples</h1>
    
    <div id="status" class="status disconnected">
        Status: Desconectado
    </div>
    
    <div>
        <button onclick="connect()">Conectar</button>
        <button onclick="disconnect()">Desconectar</button>
    </div>
    
    <div>
        <input type="text" id="messageInput" placeholder="Digite sua mensagem" style="width: 300px;">
        <button onclick="sendMessage()">Enviar</button>
    </div>
    
    <div id="messages" class="messages"></div>
    
    <div id="log" style="height: 150px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; background: #f8f9fa;"></div>

    <script>
        let socket = null;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.textContent = 'Status: Conectado';
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = 'Status: Desconectado';
            }
        }
        
        function connect() {
            if (socket) {
                socket.close();
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${window.location.host}/ws/notify/`;
            
            log(`Tentando conectar: ${url}`);
            socket = new WebSocket(url);
            
            socket.onopen = function(event) {
                log('✅ WebSocket conectado com sucesso');
                updateStatus(true);
            };
            
            socket.onmessage = function(event) {
                log(`📨 Mensagem recebida: ${event.data}`);
                try {
                    const data = JSON.parse(event.data);
                    addMessage(JSON.stringify(data, null, 2));
                } catch (e) {
                    addMessage(event.data);
                }
            };
            
            socket.onclose = function(event) {
                log(`❌ WebSocket desconectado. Código: ${event.code}`);
                updateStatus(false);
            };
            
            socket.onerror = function(error) {
                log(`❌ Erro no WebSocket: ${error}`);
                updateStatus(false);
            };
        }
        
        function disconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                alert('Digite uma mensagem');
                return;
            }
            
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert('WebSocket não está conectado');
                return;
            }
            
            socket.send(JSON.stringify({
                message: message,
                timestamp: new Date().toISOString()
            }));
            
            log(`📤 Mensagem enviada: ${message}`);
            addMessage(`Você: ${message}`);
            input.value = '';
        }
        
        function addMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Enter para enviar mensagem
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        log('🚀 Página carregada. Pronto para testar!');
    </script>
</body>
</html>
