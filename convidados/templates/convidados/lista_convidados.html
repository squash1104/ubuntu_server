{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="card-title h3 mb-0">Convidados</h1>
            <a href="{% url 'convidados:cadastrar_convidado' %}" class="btn btn-primary">Novo Convidado</a>
        </div>

        <form id="search-form" method="get" class="mb-4">
            <div class="input-group">
                <span class="input-group-text">Buscar:</span>
                <input type="text" id="id_search" class="form-control" name="q" value="{{ termo_busca }}" placeholder="Pesquise por nome, telefone, cidade, bairro ou colaborador...">
            </div>
        </form>

        <hr>

        <div id="convidados-table-container">
            {% include 'convidados/convidados_table_fragment.html' %}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
    <script>
    // ESTE SCRIPT É UMA CÓPIA DO QUE FUNCIONA, ADAPTADO PARA 'CONVIDADOS'
    document.addEventListener('DOMContentLoaded', function() {
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('id_search');
        const resultsContainer = document.getElementById('convidados-table-container'); // <-- ID CORRIGIDO
        let typingTimer;
        const doneTypingInterval = 400;

        function updateTable(url) {
            resultsContainer.style.opacity = '0.5';
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    resultsContainer.innerHTML = html;
                    resultsContainer.style.opacity = '1';
                })
                .catch(error => console.error('Erro na busca AJAX:', error));
        }

        // Evento para a ORDENAÇÃO POR COLUNA
        resultsContainer.addEventListener('click', function(event) {
            const targetLink = event.target.closest('th a');
            if (targetLink) {
                event.preventDefault();
                updateTable(targetLink.href);
            }
        });

        // Evento para a BUSCA (submit do formulário)
        searchForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const query = searchInput.value;
            const url = `{% url 'convidados:lista_convidados' %}?q=${encodeURIComponent(query)}&is_ajax=true`; // <-- URL CORRIGIDA
            updateTable(url);
        });

        // Evento para buscar DINAMICAMENTE enquanto digita
        searchInput.addEventListener('keyup', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                searchForm.dispatchEvent(new Event('submit'));
            }, doneTypingInterval);
        });
    });
    </script>
{% endblock %}
