{% extends 'base.html' %}
{% load static %}

{% block title %}SisAps - Convidados{% endblock %}

{% block extra_css %}
    <style>

        th a { text-decoration: none; color: inherit; }

        .btn-warning {
            color: #ffffff !important;
        }

        .table-scroll-container {
            max-height: 593px; /* Defina a altura máxima que a tabela pode ter */
            overflow-y: auto;  /* Adiciona a barra de rolagem vertical quando necessário */
            border: 1px solid #dee2e6; /* Borda subtil à volta da área de rolagem */
            border-top-left-radius: 0.375rem;
            border-top-right-radius: 0.375rem;
            border-bottom-left-radius: 0;
        }
        .table-scroll-container .table {
            {#min-width: 800px;#}
            width: 100%;
            margin-bottom: 0;
        }
        .table-light {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #f8f9fa;
        }
        .table-scroll-container th,
        .table-scroll-container td {
            {#white-space: nowrap;#}
            box-sizing: border-box;
        }

        .summary-bar {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-top: none;
            padding: 0.75rem 1rem;
            border-bottom-left-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
            font-weight: 500;
        }

        body.dark-theme {
            background: linear-gradient(to right, #333, #555);
            color: #f0f0f0;
        }
        body.dark-theme .table {
            color: #f8f9fa;
            --bs-table-hover-bg: #495057; /* Cor do hover para o tema escuro */
        }
        body.dark-theme .table-light {
            background-color: #212529 !important; /* Fundo do cabeçalho em cinza escuro */
            border-color: #495057 !important;
            color: #f8f9fa !important;
        }
        body.dark-theme .table-scroll-container {
            border-color: #495057;
        }

        body.dark-theme .input-group-text {
            background-color: #212529;
        }
        body.dark-theme .form-control {
            background-color: #2b3035; /* Fundo do campo de busca */
            border-color: #5a5a5a;
            color: #f0f0f0; /* Texto do campo de busca */
        }

        body.dark-theme .summary-bar {
            background-color: #2b3035;
            border-color: #495057;
            color: #f8f9fa;
        }



        /* Regra para o hover, que você já tem */
        body.dark-theme .table {
            color: #f8f9fa;
            --bs-table-hover-bg: #495057;
        }

    </style>

{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="card-title h3 mb-0">Convidados</h1>
            <a href="{% url 'convidados:cadastrar_convidado' %}" class="btn btn-primary">Novo Convidado</a>
        </div>

        <form id="search-form" method="get" class="mb-4">
            <div class="input-group">
                <span class="input-group-text">Buscar:</span>
                <input type="text" id="id_search" class="form-control" name="q" value="{{ termo_busca }}" placeholder="Pesquise por nome, telefone, cidade, bairro ou colaborador...">
            </div>
        </form>

        <hr>

        <div id="convidados-table-container">
            {% include 'convidados/convidados_table_fragment.html' %}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
    <script>
    // ESTE SCRIPT É UMA CÓPIA DO QUE FUNCIONA, ADAPTADO PARA 'CONVIDADOS'
    document.addEventListener('DOMContentLoaded', function() {
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('id_search');
        const resultsContainer = document.getElementById('convidados-table-container'); // <-- ID CORRIGIDO
        let typingTimer;
        const doneTypingInterval = 400;

        function updateTable(url) {
            resultsContainer.style.opacity = '0.5';
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    resultsContainer.innerHTML = html;
                    resultsContainer.style.opacity = '1';
                })
                .catch(error => console.error('Erro na busca AJAX:', error));
        }

        // Evento para a ORDENAÇÃO POR COLUNA
        resultsContainer.addEventListener('click', function(event) {
            const targetLink = event.target.closest('th a');
            if (targetLink) {
                event.preventDefault();
                updateTable(targetLink.href);
            }
        });

        // Evento para a BUSCA (submit do formulário)
        searchForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const query = searchInput.value;
            const url = `{% url 'convidados:lista_convidados' %}?q=${encodeURIComponent(query)}&is_ajax=true`; // <-- URL CORRIGIDA
            updateTable(url);
        });

        // Evento para buscar DINAMICAMENTE enquanto digita
        searchInput.addEventListener('keyup', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                searchForm.dispatchEvent(new Event('submit'));
            }, doneTypingInterval);
        });
    });
    </script>
{% endblock %}
