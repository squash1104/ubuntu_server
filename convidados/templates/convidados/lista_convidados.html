{% extends 'base.html' %}
{% load static %}

{% block title %}Lista de Convidados{% endblock %}

{% block extra_css %}
    <style>
        .table > tbody > tr.meta-abaixo > td,
        .table-hover > tbody > tr.meta-abaixo:hover > td {
            background-color: #ffcccc;
        }

        .table > tbody > tr.meta-atingida > td,
        .table-hover > tbody > tr.meta-atingida:hover > td {
            background-color: #ccffcc;
        }

        .table > tbody > tr.meta-superada > td,
        .table-hover > tbody > tr.meta-superada:hover > td {
            background-color: #e0ccff;
        }

        th a { text-decoration: none; color: inherit; }

        .btn-warning {
            color: #ffffff !important;
        }

        th a { text-decoration: none; color: inherit; }

        /* 1. Escurece o fundo do cabeçalho da tabela */
        .table-light {
            --bs-table-bg: #e9ecef; /* Um cinza um pouco mais escuro que o padrão */
            --bs-table-border-color: #dee2e6;
        }

        /* 2. Escurece o fundo do texto "Buscar:" */
        .input-group-text {
            background-color: #e9ecef; /* O mesmo cinza do cabeçalho para consistência */
            border-color: #ced4da;
            font-weight: 500;
            color: #495057;
        }
        /* 1. Define um container para a tabela com uma altura máxima */

        .table-scroll-container {
            max-height: 600px; /* Defina a altura máxima que a tabela pode ter */
            overflow-y: auto;  /* Adiciona a barra de rolagem vertical quando necessário */
            border: 1px solid #dee2e6; /* Borda subtil à volta da área de rolagem */
            border-top-left-radius: 0.375rem;
            border-top-right-radius: 0.375rem;
            border-bottom-left-radius: 0;
        }

        /* 2. Técnica para manter o cabeçalho da tabela fixo */
        .table-scroll-container thead th {
            position: sticky; /* Faz o cabeçalho "colar" no topo */
            top: 0;
            z-index: 2; /* Garante que o cabeçalho fique por cima do conteúdo que rola */
        }

        /* 1. Força a tabela a ocupar 100% da largura do seu container de rolagem */
        .table-scroll-container .table {
            width: 100%;
            height: 100%;
        }

        .summary-bar {
            background-color: #f8f9fa; /* Um cinza claro, consistente com o cabeçalho da tabela */
            border: 1px solid #dee2e6;
            border-top: none; /* Remove a borda inferior para se fundir com a tabela */
            padding: 0.75rem 1rem;
            border-bottom-left-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
            font-weight: 500;
        }

    </style>

{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="card-title h3 mb-0">Convidados</h1>
            <a href="{% url 'convidados:cadastrar_convidado' %}" class="btn btn-primary">Novo Convidado</a>
        </div>

        <form id="search-form" method="get" class="mb-4">
            <div class="input-group">
                <span class="input-group-text">Buscar:</span>
                <input type="text" id="id_search" class="form-control" name="q" value="{{ termo_busca }}" placeholder="Pesquise por nome, telefone, cidade, bairro ou colaborador...">
            </div>
        </form>

        <hr>

        <div id="convidados-table-container">
            {% include 'convidados/convidados_table_fragment.html' %}
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('id_search');
    const tableContainer = document.getElementById('convidados-table-container');
    const summaryContainer = document.getElementById('summary-bar-container');
    let typingTimer;

    function updateContent(url) {
        tableContainer.style.opacity = '0.5';
        fetch(url)
            .then(response => response.json())
            .then(data => {
                tableContainer.innerHTML = data.table_html;
                summaryContainer.innerHTML = data.summary_html;
                tableContainer.style.opacity = '1';
            })
            .catch(error => console.error('Erro na busca AJAX:', error));
    }

    // Evento para a ORDENAÇÃO POR COLUNA (ao clicar nos links do cabeçalho)
    resultsContainer.addEventListener('click', function(event) {
        const targetLink = event.target.closest('th a');
        if (targetLink) {
            event.preventDefault();
            updateTable(targetLink.href);
        }
    });

    searchInput.addEventListener('keyup', () => {
        clearTimeout(typingTimer);
        const query = searchInput.value;
        const url = `{% url 'convidados:lista_convidados' %}?q=${encodeURIComponent(query)}&is_ajax=true`;
        typingTimer = setTimeout(() => updateContent(url), 400);
    });
});
</script>
{% endblock %}
