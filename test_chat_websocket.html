<!DOCTYPE html>
<html>
<head>
    <title>Teste WebSocket Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .messages { height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; border-radius: 3px; }
        .sent { background: #e3f2fd; text-align: right; }
        .received { background: #f5f5f5; }
        input, button { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Teste WebSocket Chat</h1>
        
        <div id="status" class="status disconnected">
            Status: Desconectado
        </div>
        
        <div>
            <label>Usuário de destino:</label>
            <input type="text" id="targetUser" placeholder="username" value="teste">
            <button onclick="connect()">Conectar</button>
            <button onclick="disconnect()">Desconectar</button>
        </div>
        
        <div>
            <input type="text" id="messageInput" placeholder="Digite sua mensagem" style="width: 400px;">
            <button onclick="sendMessage()">Enviar</button>
        </div>
        
        <div id="messages" class="messages"></div>
        
        <div>
            <h3>Log de eventos:</h3>
            <div id="log" style="height: 200px; border: 1px solid #ccc; padding: 10px; overflow-y: auto; background: #f8f9fa;"></div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentUser = 'lucianosouza'; // Usuário logado
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.textContent = 'Status: Conectado';
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = 'Status: Desconectado';
            }
        }
        
        function connect() {
            const targetUser = document.getElementById('targetUser').value;
            if (!targetUser) {
                alert('Digite um usuário de destino');
                return;
            }
            
            if (socket) {
                socket.close();
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${window.location.host}/ws/chat/${targetUser}/`;
            
            log(`Tentando conectar: ${url}`);
            socket = new WebSocket(url);
            
            socket.onopen = function(event) {
                log('✅ WebSocket conectado com sucesso');
                updateStatus(true);
            };
            
            socket.onmessage = function(event) {
                log(`📨 Mensagem recebida: ${event.data}`);
                try {
                    const data = JSON.parse(event.data);
                    if (data.message) {
                        addMessage(data.message, data.sender, false);
                    } else if (data.type === 'typing') {
                        log(`⌨️ ${data.sender} está digitando: ${data.is_typing}`);
                    }
                } catch (e) {
                    log(`❌ Erro ao processar mensagem: ${e.message}`);
                }
            };
            
            socket.onclose = function(event) {
                log(`❌ WebSocket desconectado. Código: ${event.code}, Razão: ${event.reason}`);
                updateStatus(false);
            };
            
            socket.onerror = function(error) {
                log(`❌ Erro no WebSocket: ${error}`);
                updateStatus(false);
            };
        }
        
        function disconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                alert('Digite uma mensagem');
                return;
            }
            
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert('WebSocket não está conectado');
                return;
            }
            
            const data = {
                message: message,
                timestamp: new Date().toISOString()
            };
            
            socket.send(JSON.stringify(data));
            log(`📤 Mensagem enviada: ${message}`);
            addMessage(message, currentUser, true);
            input.value = '';
        }
        
        function addMessage(message, sender, isOwn) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'sent' : 'received'}`;
            messageDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Enter para enviar mensagem
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        log('🚀 Página carregada. Pronto para testar!');
    </script>
</body>
</html>
