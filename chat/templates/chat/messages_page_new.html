{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    
    <title>SisAps - Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    <style>
        body {
            background: linear-gradient(to right, #F5F5F5, #FFFFFF);
            min-height: 100vh;
            padding-top: 70px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .chat-container {
            display: flex;
            height: calc(100vh - 100px);
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-sidebar {
            width: 350px;
            border-right: 1px solid #e5e7eb;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 18px;
            text-align: center;
        }

        .contacts-list {
            list-style: none;
            margin: 0;
            padding: 0;
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            background: #f8f9fa;
        }

        .contact-item.active {
            background: #eef2ff;
            border-left: 4px solid #667eea;
        }

        .contact-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-status {
            font-size: 12px;
            color: #6b7280;
        }

        .contact-status.online {
            color: #10b981;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .chat-user-info h5 {
            margin: 0;
            font-weight: 600;
            color: #1f2937;
        }

        .chat-user-status {
            font-size: 12px;
            color: #6b7280;
        }

        .chat-user-status.online {
            color: #10b981;
        }

        .connection-status {
            margin-left: auto;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .connection-status.connected {
            background: #d1fae5;
            color: #065f46;
        }

        .connection-status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        .connection-status.connecting {
            background: #fef3c7;
            color: #92400e;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            margin-bottom: 12px;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-content {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .message-text {
            margin: 0;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            max-width: 70%;
            margin-bottom: 12px;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #6b7280;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 12px 16px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
            font-size: 14px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .no-chat-selected {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 16px;
        }

        .date-separator {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .date-separator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .date-separator span {
            background: #f9fafb;
            padding: 0 16px;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <i class="bi bi-chat-dots me-2"></i>SisAps
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'home' %}">
                    <i class="bi bi-house me-1"></i>Início
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="chat-container">
            <!-- Sidebar de contatos -->
            <div class="chat-sidebar">
                <div class="sidebar-header">
                    <i class="bi bi-chat-dots me-2"></i>Chat
                </div>
                <ul class="contacts-list" id="contacts-list">
                    <!-- Contatos serão carregados aqui -->
                </ul>
            </div>

            <!-- Área principal do chat -->
            <div class="chat-main">
                <div id="no-chat-selected" class="no-chat-selected">
                    <div class="text-center">
                        <i class="bi bi-chat-dots" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                        <h5>Selecione um contato para iniciar uma conversa</h5>
                        <p class="text-muted">Escolha um usuário da lista ao lado para começar a conversar</p>
                    </div>
                </div>

                <div id="chat-interface" style="display: none;">
                    <!-- Cabeçalho do chat -->
                    <div class="chat-header">
                        <div class="chat-avatar" id="chat-avatar">
                            <!-- Avatar será definido aqui -->
                        </div>
                        <div class="chat-user-info">
                            <h5 id="chat-user-name">Nome do Usuário</h5>
                            <div class="chat-user-status" id="chat-user-status">offline</div>
                        </div>
                        <div class="connection-status disconnected" id="connection-status">
                            Desconectado
                        </div>
                    </div>

                    <!-- Mensagens -->
                    <div class="chat-messages" id="chat-messages">
                        <!-- Mensagens serão carregadas aqui -->
                    </div>

                    <!-- Indicador de digitação -->
                    <div class="typing-indicator" id="typing-indicator">
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>

                    <!-- Input de mensagem -->
                    <div class="chat-input-container">
                        <div class="chat-input-wrapper">
                            <textarea 
                                class="chat-input" 
                                id="message-input" 
                                placeholder="Digite sua mensagem..."
                                rows="1"
                            ></textarea>
                            <button class="send-button" id="send-button" disabled>
                                <i class="bi bi-send"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'chat/dedicated_chat.js' %}"></script>
    
    <script>
        // Variáveis globais
        let currentContact = null;
        let contacts = [];
        let messageInput = null;
        let sendButton = null;
        let chatMessages = null;
        let typingIndicator = null;
        let connectionStatus = null;

        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Inicializando página de chat...');
            
            // Obter elementos
            messageInput = document.getElementById('message-input');
            sendButton = document.getElementById('send-button');
            chatMessages = document.getElementById('chat-messages');
            typingIndicator = document.getElementById('typing-indicator');
            connectionStatus = document.getElementById('connection-status');
            
            // Configurar chat dedicado
            setupDedicatedChat();
            
            // Carregar contatos
            loadContacts();
            
            // Configurar eventos
            setupEventListeners();
            
            console.log('✅ Página de chat inicializada');
        });

        // Configurar chat dedicado
        function setupDedicatedChat() {
            // Sobrescrever callbacks do chat dedicado
            window.dedicatedChat.onConnectionEstablished = function() {
                console.log('✅ Conexão estabelecida');
                updateConnectionStatus('connected', 'Conectado');
            };

            window.dedicatedChat.onMessageReceived = function(data) {
                console.log('📨 Mensagem recebida:', data);
                addMessage(data.message, data.sender, data.timestamp, false, data.id);
            };

            window.dedicatedChat.onTypingEvent = function(data) {
                console.log('⌨️ Digitação:', data);
                if (data.sender !== window.LOGGED_USER) {
                    if (data.is_typing) {
                        showTypingIndicator(data.sender);
                    } else {
                        hideTypingIndicator();
                    }
                }
            };

            window.dedicatedChat.onSeenEvent = function(data) {
                console.log('👁️ Visto:', data);
                // Implementar indicador de visto se necessário
            };

            window.dedicatedChat.onConnectionError = function(error) {
                console.error('❌ Erro de conexão:', error);
                updateConnectionStatus('disconnected', 'Erro de conexão');
            };

            window.dedicatedChat.onConnectionFailed = function() {
                console.error('❌ Falha na conexão');
                updateConnectionStatus('disconnected', 'Falha na conexão');
            };
        }

        // Carregar contatos
        async function loadContacts() {
            try {
                console.log('📋 Carregando contatos...');
                const response = await fetch('/chat/lista/');
                contacts = await response.json();
                
                renderContacts();
                console.log('✅ Contatos carregados:', contacts.length);
            } catch (error) {
                console.error('❌ Erro ao carregar contatos:', error);
            }
        }

        // Renderizar contatos
        function renderContacts() {
            const contactsList = document.getElementById('contacts-list');
            contactsList.innerHTML = '';

            contacts.forEach(contact => {
                const li = document.createElement('li');
                li.className = 'contact-item';
                li.onclick = () => openChat(contact);
                
                const avatar = contact.full_name ? contact.full_name.charAt(0).toUpperCase() : contact.username.charAt(0).toUpperCase();
                
                li.innerHTML = `
                    <div class="contact-avatar">${avatar}</div>
                    <div class="contact-info">
                        <div class="contact-name">${contact.full_name || contact.username}</div>
                        <div class="contact-status ${contact.online ? 'online' : ''}">
                            ${contact.online ? 'Online' : 'Offline'}
                        </div>
                    </div>
                `;
                
                contactsList.appendChild(li);
            });
        }

        // Abrir chat com contato
        async function openChat(contact) {
            console.log('💬 Abrindo chat com:', contact.username);
            
            // Atualizar interface
            currentContact = contact;
            updateActiveContact(contact);
            showChatInterface(contact);
            
            // Conectar WebSocket
            await window.dedicatedChat.connect(contact.username);
            
            // Carregar histórico
            await loadChatHistory(contact.username);
        }

        // Atualizar contato ativo
        function updateActiveContact(contact) {
            // Remover classe active de todos os contatos
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Adicionar classe active ao contato selecionado
            const contactItems = document.querySelectorAll('.contact-item');
            contacts.forEach((c, index) => {
                if (c.username === contact.username) {
                    contactItems[index].classList.add('active');
                }
            });
        }

        // Mostrar interface do chat
        function showChatInterface(contact) {
            document.getElementById('no-chat-selected').style.display = 'none';
            document.getElementById('chat-interface').style.display = 'flex';
            
            // Atualizar cabeçalho
            document.getElementById('chat-user-name').textContent = contact.full_name || contact.username;
            document.getElementById('chat-user-status').textContent = contact.online ? 'Online' : 'Offline';
            document.getElementById('chat-user-status').className = `chat-user-status ${contact.online ? 'online' : ''}`;
            
            const avatar = contact.full_name ? contact.full_name.charAt(0).toUpperCase() : contact.username.charAt(0).toUpperCase();
            document.getElementById('chat-avatar').textContent = avatar;
            
            // Limpar mensagens
            chatMessages.innerHTML = '';
            
            // Habilitar input
            messageInput.disabled = false;
            messageInput.focus();
        }

        // Carregar histórico do chat
        async function loadChatHistory(username) {
            try {
                console.log('📜 Carregando histórico para:', username);
                const response = await fetch(`/chat/historico/${username}/`);
                const messages = await response.json();
                
                chatMessages.innerHTML = '';
                
                messages.forEach(msg => {
                    addMessage(msg.message, msg.sender, msg.timestamp, msg.is_own, msg.id, true);
                });
                
                // Scroll para baixo
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                console.log('✅ Histórico carregado:', messages.length, 'mensagens');
            } catch (error) {
                console.error('❌ Erro ao carregar histórico:', error);
            }
        }

        // Adicionar mensagem
        function addMessage(message, sender, timestamp, isOwn, messageId = null, isFromHistory = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'sent' : 'received'}`;
            
            const time = new Date(timestamp).toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            messageDiv.innerHTML = `
                <div class="message-content">
                    <div class="message-text">${message}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            chatMessages.appendChild(messageDiv);
            
            // Scroll para baixo se não for do histórico
            if (!isFromHistory) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // Mostrar indicador de digitação
        function showTypingIndicator(sender) {
            typingIndicator.classList.add('show');
        }

        // Esconder indicador de digitação
        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        // Atualizar status da conexão
        function updateConnectionStatus(status, text) {
            connectionStatus.className = `connection-status ${status}`;
            connectionStatus.textContent = text;
        }

        // Configurar event listeners
        function setupEventListeners() {
            // Enviar mensagem
            sendButton.onclick = sendMessage;
            
            // Enter para enviar
            messageInput.onkeydown = function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };
            
            // Detectar digitação
            messageInput.oninput = function() {
                if (currentContact) {
                    window.dedicatedChat.handleTyping();
                }
                
                // Auto-resize
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
                
                // Habilitar/desabilitar botão
                sendButton.disabled = !this.value.trim();
            };
        }

        // Enviar mensagem
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !currentContact) return;
            
            console.log('📤 Enviando mensagem:', message);
            
            // Enviar via WebSocket
            const success = window.dedicatedChat.sendMessage(message);
            
            if (success) {
                // Adicionar mensagem à interface
                addMessage(message, window.LOGGED_USER, new Date().toISOString(), true);
                
                // Limpar input
                messageInput.value = '';
                messageInput.style.height = 'auto';
                sendButton.disabled = true;
                
                // Scroll para baixo
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else {
                console.error('❌ Falha ao enviar mensagem');
            }
        }
    </script>
</body>
</html>
