<!DOCTYPE html>
<html>
<head>
    <title>Teste WebSocket Chat</title>
</head>
<body>
    <h1>Teste WebSocket Chat</h1>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Digite uma mensagem...">
    <button onclick="sendMessage()">Enviar</button>
    <button onclick="connectWebSocket()">Conectar</button>
    
    <script>
        let socket;
        
        function connectWebSocket() {
            const protocol = (location.protocol === 'https:') ? 'wss' : 'ws';
            const username = 'test_user'; // Substitua por um usuário real
            socket = new WebSocket(`${protocol}://${window.location.host}/ws/chat/${username}/`);
            
            socket.onopen = function(e) {
                console.log("WebSocket conectado!");
                document.getElementById('messages').innerHTML += '<p>Conectado!</p>';
            };
            
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log("Mensagem recebida:", data);
                document.getElementById('messages').innerHTML += `<p><strong>${data.sender}:</strong> ${data.message}</p>`;
            };
            
            socket.onclose = function(event) {
                console.log("WebSocket desconectado!");
                document.getElementById('messages').innerHTML += '<p>Desconectado!</p>';
            };
            
            socket.onerror = function(error) {
                console.error("Erro WebSocket:", error);
                document.getElementById('messages').innerHTML += '<p>Erro na conexão!</p>';
            };
        }
        
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value;
            
            if (socket && socket.readyState === WebSocket.OPEN && message) {
                socket.send(JSON.stringify({
                    'message': message,
                    'timestamp': new Date().toISOString()
                }));
                messageInput.value = '';
            }
        }
        
        document.getElementById('messageInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
