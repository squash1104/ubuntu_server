{% extends 'recepcao/base_recepcao.html' %}
{% block content %}
<div class="rec-card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h5 mb-0">Atendentes</h1>
      <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoAtendente">Novo atendente</button>
    </div>

    <div class="table-responsive">
      <table class="table table-sm table-striped">
        <thead>
          <tr><th>Nome</th><th class="text-end">Ações</th></tr>
        </thead>
        <tbody>
          {% for a in atendentes %}
          <tr>
            <td>{{ a.nome }}</td>
            <td class="text-end">
              <form method="post" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="user_id" value="{{ a.id }}" />
                <input type="hidden" name="action" value="remove" />
                <button class="btn btn-sm btn-outline-danger">Remover</button>
              </form>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="2" class="text-muted">Nenhum atendente cadastrado.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal novo atendente -->
<div class="modal fade" id="modalNovoAtendente" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{% url 'recepcao:atendentes' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Novo Atendente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" name="action" value="create" class="btn btn-primary">Criar</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
