<!DOCTYPE html>
<html>
<head>
    <title>Teste Chat Simples</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-box { border: 1px solid #ccc; padding: 20px; margin: 20px 0; }
        .messages { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; border-radius: 5px; }
        .sent { background: #e3f2fd; text-align: right; }
        .received { background: #f3e5f5; }
        input, button { margin: 5px; padding: 8px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Teste Chat Simples</h1>
    
    <div class="chat-box">
        <h3>Chat com: <span id="chat-user">Nenhum usuário selecionado</span></h3>
        
        <div class="messages" id="messages"></div>
        
        <div>
            <input type="text" id="messageInput" placeholder="Digite uma mensagem..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>Enviar</button>
        </div>
    </div>
    
    <div>
        <h3>Contatos:</h3>
        <div id="contacts"></div>
    </div>
    
    <div>
        <h3>Logs:</h3>
        <div id="logs" class="log"></div>
    </div>
    
    <script>
        let currentChatUser = null;
        let chatSocket = null;
        
        // Simular usuário logado
        window.LOGGED_USER = 'usuario_teste';
        
        function log(message) {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logsDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }
        
        function loadContacts() {
            // Simular carregamento de contatos
            const contacts = [
                { username: 'usuario1', full_name: 'Usuário Um' },
                { username: 'usuario2', full_name: 'Usuário Dois' },
                { username: 'usuario3', full_name: 'Usuário Três' }
            ];
            
            const contactsDiv = document.getElementById('contacts');
            contactsDiv.innerHTML = '';
            
            contacts.forEach(contact => {
                const contactDiv = document.createElement('div');
                contactDiv.style.cursor = 'pointer';
                contactDiv.style.padding = '10px';
                contactDiv.style.margin = '5px';
                contactDiv.style.border = '1px solid #ddd';
                contactDiv.style.borderRadius = '5px';
                contactDiv.innerHTML = `<strong>${contact.full_name}</strong> (${contact.username})`;
                contactDiv.onclick = () => startChat(contact.username, contact.full_name);
                contactsDiv.appendChild(contactDiv);
            });
        }
        
        function startChat(username, fullName) {
            log(`Iniciando chat com: ${username} (${fullName})`);
            
            currentChatUser = username;
            document.getElementById('chat-user').textContent = fullName;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            // Limpar mensagens
            document.getElementById('messages').innerHTML = '';
            
            // Conectar WebSocket
            connectWebSocket(username);
        }
        
        function connectWebSocket(username) {
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.close();
            }
            
            const protocol = (location.protocol === 'https:') ? 'wss' : 'ws';
            const wsUrl = `${protocol}://${window.location.host}/ws/chat/${username}/`;
            
            log(`Conectando WebSocket em: ${wsUrl}`);
            
            try {
                chatSocket = new WebSocket(wsUrl);
                
                chatSocket.onopen = function() {
                    log(`WebSocket conectado para ${username}`);
                };
                
                chatSocket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        log(`Mensagem recebida: ${JSON.stringify(data)}`);
                        
                        if (data.message) {
                            addMessage(data.sender, data.message, false);
                        }
                    } catch (e) {
                        log(`Erro ao processar mensagem: ${e}`);
                    }
                };
                
                chatSocket.onclose = function(event) {
                    log(`WebSocket desconectado para ${username}. Código: ${event.code}`);
                };
                
                chatSocket.onerror = function(error) {
                    log(`Erro no WebSocket: ${error}`);
                };
                
            } catch (error) {
                log(`Erro ao criar WebSocket: ${error}`);
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentChatUser) {
                log('Nenhuma mensagem ou usuário selecionado');
                return;
            }
            
            if (!chatSocket || chatSocket.readyState !== WebSocket.OPEN) {
                log('WebSocket não está conectado');
                addMessage('Você', message, true);
                input.value = '';
                return;
            }
            
            const data = {
                message: message,
                timestamp: new Date().toISOString()
            };
            
            try {
                chatSocket.send(JSON.stringify(data));
                log(`Mensagem enviada: ${JSON.stringify(data)}`);
                addMessage('Você', message, true);
                input.value = '';
            } catch (error) {
                log(`Erro ao enviar mensagem: ${error}`);
                addMessage('Você', message, true);
                input.value = '';
            }
        }
        
        function addMessage(sender, text, isOwn) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'sent' : 'received'}`;
            messageDiv.textContent = `${sender}: ${text}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Event listeners
        document.getElementById('messageInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Carregar contatos ao iniciar
        window.onload = function() {
            log('Página carregada. Clique em um contato para iniciar o chat.');
            loadContacts();
        };
    </script>
</body>
</html>
