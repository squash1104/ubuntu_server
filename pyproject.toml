[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
  \.venv
  | migrations
  | static
  | media
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
extend-exclude = ["migrations", ".venv", "static", "media"]

[tool.ruff.lint]
select = ["E","F","W","I","UP","B","C4","RET","SIM","N","RUF"]
ignore = [
  "E203",  # compatibilidade com Black
]

[tool.pytest.ini_options]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "sistema_fidelizacao.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "venv",
    "migrations",
    "static",
    "media"
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
pythonPlatform = "Linux"
# executionEnvironments removed to avoid TOML parsing issues in CI/editor
