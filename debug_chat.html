<!DOCTYPE html>
<html>
<head>
    <title>Debug Chat WebSocket</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        input, button { margin: 5px; padding: 8px; }
    </style>
</head>
<body>
    <h1>Debug Chat WebSocket</h1>
    
    <div>
        <label>Usuário para conectar:</label>
        <input type="text" id="username" value="teste" placeholder="Digite o username">
        <button onclick="connectWebSocket()">Conectar WebSocket</button>
        <button onclick="disconnectWebSocket()">Desconectar</button>
    </div>
    
    <div>
        <label>Mensagem:</label>
        <input type="text" id="messageInput" placeholder="Digite uma mensagem">
        <button onclick="sendMessage()">Enviar</button>
    </div>
    
    <div>
        <h3>Status:</h3>
        <div id="status" class="log">Desconectado</div>
    </div>
    
    <div>
        <h3>Logs:</h3>
        <div id="logs" class="log"></div>
    </div>
    
    <script>
        let socket = null;
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }
        
        function connectWebSocket() {
            const username = document.getElementById('username').value;
            if (!username) {
                log('Digite um username!', 'error');
                return;
            }
            
            if (socket && socket.readyState === WebSocket.OPEN) {
                log('WebSocket já está conectado!', 'error');
                return;
            }
            
            const protocol = (location.protocol === 'https:') ? 'wss' : 'ws';
            const wsUrl = `${protocol}://${window.location.host}/ws/chat/${username}/`;
            
            log(`Tentando conectar em: ${wsUrl}`, 'info');
            
            try {
                socket = new WebSocket(wsUrl);
                
                socket.onopen = function(e) {
                    log('WebSocket conectado com sucesso!', 'success');
                    document.getElementById('status').textContent = 'Conectado';
                    document.getElementById('status').className = 'log success';
                };
                
                socket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        log(`Mensagem recebida: ${JSON.stringify(data)}`, 'success');
                    } catch (e) {
                        log(`Mensagem recebida (raw): ${event.data}`, 'info');
                    }
                };
                
                socket.onclose = function(event) {
                    log(`WebSocket desconectado. Código: ${event.code}, Razão: ${event.reason}`, 'error');
                    document.getElementById('status').textContent = 'Desconectado';
                    document.getElementById('status').className = 'log error';
                    socket = null;
                };
                
                socket.onerror = function(error) {
                    log(`Erro no WebSocket: ${error}`, 'error');
                };
                
            } catch (error) {
                log(`Erro ao criar WebSocket: ${error}`, 'error');
            }
        }
        
        function disconnectWebSocket() {
            if (socket) {
                socket.close();
                log('WebSocket desconectado manualmente', 'info');
            } else {
                log('Nenhum WebSocket ativo para desconectar', 'error');
            }
        }
        
        function sendMessage() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                log('WebSocket não está conectado!', 'error');
                return;
            }
            
            const message = document.getElementById('messageInput').value;
            if (!message) {
                log('Digite uma mensagem!', 'error');
                return;
            }
            
            const data = {
                message: message,
                timestamp: new Date().toISOString()
            };
            
            try {
                socket.send(JSON.stringify(data));
                log(`Mensagem enviada: ${JSON.stringify(data)}`, 'success');
                document.getElementById('messageInput').value = '';
            } catch (error) {
                log(`Erro ao enviar mensagem: ${error}`, 'error');
            }
        }
        
        // Conectar automaticamente ao carregar a página
        window.onload = function() {
            log('Página carregada. Clique em "Conectar WebSocket" para testar.', 'info');
        };
        
        // Permitir enviar com Enter
        document.getElementById('messageInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
